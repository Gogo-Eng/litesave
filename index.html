<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P2E Savings Group</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>LiteSave Savings Group</h1>
    <p>20% weekly return on total pool</p>
  </header>

  <main>
    <section id="register-section">
      <h2>Student Registration</h2>
      <form id="register-form">
        <input type="text" id="name" placeholder="Enter your name" required />
        <select id="tier" required>
          <option value="">-- Select Tier --</option>
          <option value="1">Tier 1 – ₦10,000 (5% interest)</option>
          <option value="2">Tier 2 – ₦20,000 (10% interest)</option>
          <option value="3">Tier 3 – ₦30,000 (20% interest)</option>
        </select>
        <button type="submit">Register & Deposit</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <h2>Savings Dashboard</h2>
      <div class="stats">
        <div class="stat">
          <p>Total Pool</p>
          <strong id="total-pool">₦0</strong>
        </div>
        <div class="stat">
          <p>Weekly Interest</p>
          <strong id="weekly-interest">₦0</strong>
        </div>
        <div class="stat">
          <p>Members</p>
          <strong id="member-count">0</strong>
        </div>
      </div>

      <table id="members-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Tier</th>
            <th>Contribution</th>
            <th>Interest</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="members-body"></tbody>
      </table>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3>Withdraw Funds</h3>
      <p>Available: <span id="available-amount">₦0</span></p>
      <input type="number" id="withdraw-amount" placeholder="Amount to withdraw" />
      <div class="modal-buttons">
        <button id="cancel-withdraw">Cancel</button>
        <button id="confirm-withdraw">Withdraw</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
